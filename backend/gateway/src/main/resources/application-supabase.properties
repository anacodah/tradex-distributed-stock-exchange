# Supabase Hosted Database Profile
# Connection uses TLS / sslmode=require for secure cloud database communication
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://${DB_HOST:db.supabase.co}:${DB_PORT:5432}/${POSTGRES_DB:postgres}?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:${POSTGRES_USER:postgres}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
