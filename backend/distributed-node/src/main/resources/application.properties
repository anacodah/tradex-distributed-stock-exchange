spring.application.name=distributed-node

server.port=${PORT:8080}
node.id=${NODE_ID:1}
node.name=${NODE_NAME:node1}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:tradex}}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Java RMI and Distributed Cluster Configuration
rmi.port=${RMI_PORT:1099}
rmi.host=${RMI_HOST:localhost}
node.peers=${NODE_PEERS:node1:1099,node2:1099,node3:1099}
rmi.connect.timeout.ms=3000
rmi.read.timeout.ms=5000
