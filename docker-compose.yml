version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tradex}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tradex}"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - DB_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-tradex}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL:-}
      - SUPABASE_DB_USER=${SUPABASE_DB_USER:-}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-super-secret-key-that-is-at-least-256-bits-long-so-change-this-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  node1:
    build:
      context: ./backend
      dockerfile: distributed-node/Dockerfile
    container_name: node1
    environment:
      - NODE_ID=1
      - NODE_NAME=node1
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-tradex}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL:-}
      - SUPABASE_DB_USER=${SUPABASE_DB_USER:-}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD:-}
      - RMI_PORT=1099
      - RMI_HOST=node1
      - NODE_PEERS=node1:1099,node2:1099,node3:1099
    ports:
      - "8081:8080"
      - "1099:1099"
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  node2:
    build:
      context: ./backend
      dockerfile: distributed-node/Dockerfile
    container_name: node2
    environment:
      - NODE_ID=2
      - NODE_NAME=node2
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-tradex}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL:-}
      - SUPABASE_DB_USER=${SUPABASE_DB_USER:-}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD:-}
      - RMI_PORT=1099
      - RMI_HOST=node2
      - NODE_PEERS=node1:1099,node2:1099,node3:1099
    ports:
      - "8082:8080"
      - "1100:1099"
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  node3:
    build:
      context: ./backend
      dockerfile: distributed-node/Dockerfile
    container_name: node3
    environment:
      - NODE_ID=3
      - NODE_NAME=node3
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-tradex}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL:-}
      - SUPABASE_DB_USER=${SUPABASE_DB_USER:-}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD:-}
      - RMI_PORT=1099
      - RMI_HOST=node3
      - NODE_PEERS=node1:1099,node2:1099,node3:1099
    ports:
      - "8083:8080"
      - "1101:1099"
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway
